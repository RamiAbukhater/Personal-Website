<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects | Rami Abukhater</title>
    <link rel="stylesheet" href="../style.css" />
    <script type="module" src="../global.js"></script>
    <script type="module" src="projects.js"></script>
  </head>
  <body class="home">
    <header class="site-header">
      <a class="brand" href="../">Rami Abukhater</a>
    </header>

    <section class="projects-intro">
      <div>
        <h1 class="projects-title">Projects</h1>
        <p class="tagline">Research, Robotics &amp; Full-Stack Builds</p>
        <p class="bio">
          Everything I am building now and have built before. Click a slice or a
          year to filter by year, search to narrow further, or do both.
        </p>
      </div>

      <div class="container">
        <svg id="projects-pie-plot" viewBox="-50 -50 100 100" role="img" aria-label="Pie chart of projects per year"></svg>
        <ul class="legend"></ul>
      </div>

      <input class="searchBar" type="search" aria-label="Search projects" placeholder="🔍 Search projects…" />
    </section>

    <section class="home-panel">
      <h2>Current Projects</h2>

      <div class="projects" id="current-projects">
        <!-- Filled in by projects.js from lib/projects.json -->
      </div>
    </section>

    <section class="home-panel">
      <h2>Past Projects</h2>

      <div class="projects" id="past-projects">
        <!-- Filled in by projects.js from lib/projects.json -->
      </div>
    </section>
  </body>
</html>
