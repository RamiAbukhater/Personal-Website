<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume | Rami Abukhater</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="stylesheet" href="book.css" />
    <script type="module" src="../global.js"></script>
    <script type="module" src="book.js"></script>
  </head>
  <body class="resume-book">
    <header class="site-header">
      <a class="brand" href="../">Rami Abukhater</a>
    </header>

    <main class="book-stage">
      <div class="book-tools">
        <button type="button" class="book-skip">Skip animation</button>
        <button type="button" class="book-replay" hidden>Close and reopen</button>
        <button type="button" class="book-print">Print / save as PDF</button>
      </div>

      <div class="book" data-state="closed">
        <div class="book-body">
          <article class="page page-left" aria-label="Resume, first page"></article>
          <article class="page page-right" aria-label="Resume, second page"></article>
          <span class="ribbon" aria-hidden="true"></span>
        </div>

        <!-- The cover is decoration; the resume text is always in the pages above -->
        <div class="cover" aria-hidden="true">
          <div class="cover-front">
            <div class="cover-frame">
              <svg class="cover-emblem" viewBox="0 0 120 80">
                <!-- A little low-poly island, after the one on the home page -->
                <path class="emblem-sea" d="M8 62 Q30 56 60 60 T112 60" />
                <path class="emblem-rock" d="M22 60 L34 42 L50 46 L62 32 L78 38 L90 48 L98 60 Z" />
                <path class="emblem-town" d="M48 46 V36 H56 V31 L60 27 L64 31 V40 H72 V44" />
                <path class="emblem-sun" d="M86 22 a6 6 0 1 0 0.01 0" />
              </svg>
              <p class="cover-title"></p>
              <p class="cover-subtitle"></p>
              <p class="cover-volume"></p>
            </div>
          </div>
          <div class="cover-back"></div>
        </div>
      </div>
      <script>
        // Decided before first paint, so reduced-motion visitors never see the closed cover
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
          document.querySelector('.book').dataset.state = 'settled';
        }
      </script>

      <noscript>
        <style>.book-tools, .cover { display: none; }</style>
        <p class="book-noscript">
          This resume is drawn with JavaScript. Please turn it on, or find me on
          <a href="https://linkedin.com/in/Rami-Abukhater">LinkedIn</a>.
        </p>
      </noscript>
    </main>
  </body>
</html>
